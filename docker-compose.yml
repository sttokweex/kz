services:
  app:
    build:
      context: .
      dockerfile: dockerFile
    ports:
      - "2000:2000"
    environment:
      - PORT=2000
      - GAME_HOST=http://51.250.83.228:2000
      - REPLAY_HOST=http://51.250.83.228:2000
      - REAL_GAME_HOST=http://51.250.83.228:2000
      - ASSET_HOST=http://51.250.83.228:2000/resources
      - PROMO_HOST=http://51.250.83.228:2000
      - DB_HOST=mysql2
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=a2pe4zx5p1
      - DB_NAME=game_db
      - BuyBonusDefaultMulti=100
      - FreeMinMulti=10
      - JackpotNormalStart=50
      - JackpotNormalEnd=200
      - JackpotLongPercent=5
