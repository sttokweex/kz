services:
  app:
    build:
      context: .
      dockerfile: dockerFile
    ports:
      - "2002:2002"
    environment:
      - PORT=2002
      - GAME_HOST=http://5.129.253.12:2002
      - REPLAY_HOST=http://5.129.253.12:2002
      - REAL_GAME_HOST=http://5.129.253.12:2002
      - ASSET_HOST=http://5.129.253.12:2002/resources
      - PROMO_HOST=http://5.129.253.12:2002
      - DB_HOST=mysql-stake-kz
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=a2pe4zx5p1
      - DB_NAME=game_db
      - BuyBonusDefaultMulti=100
      - FreeMinMulti=10
      - JackpotNormalStart=50
      - JackpotNormalEnd=200
      - JackpotLongPercent=5
      - JackpotLongStart=300
      - JackpotLongEnd=400
      - SmallBaseMaxMulti=400
