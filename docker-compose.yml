
 

services:
  app:
    build: .
    ports:
      - "8940:8940"
    environment:
      - PORT=8940
      - GAME_HOST=http://localhost:8940
      - REPLAY_HOST=http://localhost:8940
      - REAL_GAME_HOST=http://localhost:8940
      - ASSET_HOST=http://localhost:8940/resources
      - PROMO_HOST=http://localhost:8940
      - DB_HOST=mysql2
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=a2pe4zx5p1
      - DB_NAME=game_db
      - BuyBonusDefaultMulti=100
      - FreeMinMulti=10
      - JackpotNormalStart=50
      - JackpotNormalEnd=200
      - JackpotLongPercent=5
      - JackpotLongStart=300
      - JackpotLongEnd=400
      - SmallBaseMaxMulti=400
    depends_on:
      - mysql2

  mysql2:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=a2pe4zx5p1
      - MYSQL_DATABASE=game_db
    expose:
      - 3306
    volumes:
      - mysql2-data:/var/lib/mysql


volumes:
  mysql2-data:
  